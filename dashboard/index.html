<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ravan Reel Studio · Your local studio</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="#"><span class="mark">rr.</span><span>RAVAN REEL<br>STUDIO</span></a>
    <div class="header-status">
      <div class="header-actions">
        <button id="theme-toggle" class="header-action-btn icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-theme icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon-theme icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button id="open-settings-btn" class="header-action-btn icon-btn" type="button" aria-label="Studio Settings" title="Studio Settings">
          <svg class="icon-gear" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <span id="connection" role="status">Connecting…</span>
      <span class="local"><i></i> ON YOUR DEVICE</span>
    </div>
  </header>
  <main id="app"><p class="muted">Loading your projects…</p></main>
  <dialog id="settings-dialog" class="settings-dialog"></dialog>
  <footer>
    <span>CREATE IN YOUR AI CHAT ↔ REVIEW HERE</span>
    <span>Built by Techno Ravan · Dashboard adapted from <a href="https://github.com/Nayan014/techno-reel" target="_blank" rel="noreferrer">Techno Reel</a> · Effects by <a href="https://github.com/Vibha-Ramprakash/claude-video-effects" target="_blank" rel="noreferrer">Vibha Ramprakash</a></span>
  </footer>
</body>
</html>
