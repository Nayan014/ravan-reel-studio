<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="326" viewBox="0 0 1260 326" role="img"><title>Two ways to start: idea, script and recording, or existing takes. Both lead to a scene plan, frame and music review, approval, then rendering and download.</title><rect width="100%" height="100%" rx="20" fill="#211b24"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ffad76"/></marker></defs><g font-family="Inter,Arial,sans-serif"><rect x="24" y="24" width="290" height="112" rx="12" fill="#302832" stroke="#6c5751"/><g transform="translate(42 41)" fill="none" stroke="#ffad76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 18C-2 6 20-2 20 10Q20 15 16 18M8 18H16M9 22H15"/></g><text x="42" y="94" font-size="22" fill="#fff0da" font-weight="600">Idea → Script → Record</text><text x="42" y="119" font-size="16" fill="#d4c4bb" font-weight="400">Start before you have footage</text><rect x="24" y="190" width="290" height="112" rx="12" fill="#302832" stroke="#6c5751"/><g transform="translate(42 207)" fill="none" stroke="#ffad76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="3" width="20" height="22" rx="3"/><path d="M9 9L17 14L9 19Z"/></g><text x="42" y="260" font-size="22" fill="#fff0da" font-weight="600">Existing recordings</text><text x="42" y="285" font-size="16" fill="#d4c4bb" font-weight="400">Start with numbered takes</text><path d="M314 80H330V163M314 246H330V163H350" fill="none" stroke="#ffad76" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="107" width="202" height="112" rx="12" fill="#302832" stroke="#6c5751"/><g transform="translate(383 124)" fill="none" stroke="#ffad76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="1" width="20" height="26" rx="3"/><path d="M8 8H18M8 14H18M8 20H14"/></g><text x="383" y="177" font-size="22" fill="#fff0da" font-weight="600">Scene plan</text><text x="383" y="202" font-size="16" fill="#d4c4bb" font-weight="400">Speech + effects</text><path d="M567 163H585" fill="none" stroke="#ffad76" stroke-width="2" marker-end="url(#arrow)"/><rect x="588" y="107" width="202" height="112" rx="12" fill="#302832" stroke="#6c5751"/><g transform="translate(606 124)" fill="none" stroke="#ffad76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M0 14Q13-3 26 14Q13 31 0 14Z"/><circle cx="13" cy="14" r="4"/></g><text x="606" y="177" font-size="22" fill="#fff0da" font-weight="600">Preview review</text><text x="606" y="202" font-size="16" fill="#d4c4bb" font-weight="400">Frames + music</text><path d="M790 163H808" fill="none" stroke="#ffad76" stroke-width="2" marker-end="url(#arrow)"/><rect x="811" y="107" width="202" height="112" rx="12" fill="#302832" stroke="#6c5751"/><g transform="translate(829 124)" fill="none" stroke="#ffad76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="13" cy="14" r="12"/><path d="M6 14L11 19L20 9"/></g><text x="829" y="177" font-size="22" fill="#fff0da" font-weight="600">Your approval</text><text x="829" y="202" font-size="16" fill="#d4c4bb" font-weight="400">Confirm the direction</text><path d="M1013 163H1031" fill="none" stroke="#ffad76" stroke-width="2" marker-end="url(#arrow)"/><rect x="1034" y="107" width="202" height="112" rx="12" fill="#302832" stroke="#6c5751"/><g transform="translate(1052 124)" fill="none" stroke="#ffad76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M13 0V18M6 11L13 18L20 11M2 20V27H24V20"/></g><text x="1052" y="177" font-size="22" fill="#fff0da" font-weight="600">Finished reel</text><text x="1052" y="202" font-size="16" fill="#d4c4bb" font-weight="400">Render + download</text></g></svg>
