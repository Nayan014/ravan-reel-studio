<svg xmlns="http://www.w3.org/2000/svg" width="600" height="774" viewBox="0 0 600 774" role="img"><title>Idea or recordings, then plan, review, approve, and export.</title><rect width="100%" height="100%" rx="20" fill="#f8f9f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#567970"/></marker></defs><g font-family="Inter,Arial,sans-serif"><rect x="24" y="24" width="252" height="112" rx="12" fill="#eaf0e9" stroke="#cfdbd5"/><g transform="translate(42 41)" fill="none" stroke="#567970" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 18C-2 6 20-2 20 10Q20 15 16 18M8 18H16M9 22H15"/></g><text x="42" y="94" font-size="22" fill="#2b4249" font-weight="600">Idea → Script → Record</text><text x="42" y="119" font-size="16" fill="#53666d" font-weight="400">Start before recording</text><rect x="304" y="24" width="272" height="112" rx="12" fill="#eaf0e9" stroke="#cfdbd5"/><g transform="translate(322 41)" fill="none" stroke="#567970" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="3" width="20" height="22" rx="3"/><path d="M9 9L17 14L9 19Z"/></g><text x="322" y="94" font-size="22" fill="#2b4249" font-weight="600">Existing recordings</text><text x="322" y="119" font-size="16" fill="#53666d" font-weight="400">Start with numbered takes</text><path d="M150 136V162H300M440 136V162H300V184" fill="none" stroke="#567970" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="194" width="440" height="112" rx="12" fill="#eaf0e9" stroke="#cfdbd5"/><g transform="translate(98 211)" fill="none" stroke="#567970" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="1" width="20" height="26" rx="3"/><path d="M8 8H18M8 14H18M8 20H14"/></g><text x="98" y="264" font-size="22" fill="#2b4249" font-weight="600">Scene plan</text><text x="98" y="289" font-size="16" fill="#53666d" font-weight="400">Review speech and choose effects</text><path d="M300 306V336" fill="none" stroke="#567970" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="342" width="440" height="112" rx="12" fill="#e8f0f5" stroke="#cfdbd5"/><g transform="translate(98 359)" fill="none" stroke="#567970" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M0 14Q13-3 26 14Q13 31 0 14Z"/><circle cx="13" cy="14" r="4"/></g><text x="98" y="412" font-size="22" fill="#2b4249" font-weight="600">Preview review</text><text x="98" y="437" font-size="16" fill="#53666d" font-weight="400">Comment on frames and audition music</text><path d="M300 454V484" fill="none" stroke="#567970" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="490" width="440" height="112" rx="12" fill="#eaf0e9" stroke="#cfdbd5"/><g transform="translate(98 507)" fill="none" stroke="#567970" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="13" cy="14" r="12"/><path d="M6 14L11 19L20 9"/></g><text x="98" y="560" font-size="22" fill="#2b4249" font-weight="600">Your approval</text><text x="98" y="585" font-size="16" fill="#53666d" font-weight="400">Approve the frames and audio</text><path d="M300 602V632" fill="none" stroke="#567970" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="638" width="440" height="112" rx="12" fill="#e8f0f5" stroke="#cfdbd5"/><g transform="translate(98 655)" fill="none" stroke="#567970" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M13 0V18M6 11L13 18L20 11M2 20V27H24V20"/></g><text x="98" y="708" font-size="22" fill="#2b4249" font-weight="600">Finished reel</text><text x="98" y="733" font-size="16" fill="#53666d" font-weight="400">Render and download your export</text></g></svg>
